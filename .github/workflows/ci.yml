name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        # --workspace: this repo is a Cargo workspace with a root package (scimitar)
        # plus keycloak-it (GitHub issue #1's example consumer) -- without --workspace,
        # commands run at the workspace root default to the root package alone (checked
        # directly: `cargo clippy --all-targets` here without this flag silently skips
        # keycloak-it entirely), which would leave the example crate's own fmt/clippy/
        # test/doc quality with zero CI coverage of its own.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: doctest
        run: cargo test --workspace --doc
      - name: doc (fails on broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --lib
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: dependency vulnerability audit
        run: cargo audit
